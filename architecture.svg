<svg viewBox="0 0 1220 920" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7b85"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1220" height="920" fill="#ffffff"/>

  <!-- Row 1: Source -->
  <rect x="410" y="30" width="400" height="80" rx="10" fill="#fdf3d8" stroke="#c9971f" stroke-width="2"/>
  <text x="610" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2530">LBNL Utility-Scale Solar, 2025 Edition</text>
  <text x="610" y="82" text-anchor="middle" font-size="13" fill="#4a5560">59-tab Excel workbook, 1,775 projects (data.openei.org)</text>

  <!-- Arrow row1 -> row2 -->
  <line x1="610" y1="110" x2="610" y2="150" stroke="#6b7b85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: download -->
  <rect x="410" y="150" width="400" height="60" rx="10" fill="#ffffff" stroke="#10202b" stroke-width="2"/>
  <text x="610" y="186" text-anchor="middle" font-size="14" font-family="monospace" fill="#1a2530">download_lbnl_data.py</text>

  <line x1="610" y1="210" x2="610" y2="250" stroke="#6b7b85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 3: exploration (three small boxes) -->
  <rect x="80" y="250" width="330" height="70" rx="10" fill="#ffffff" stroke="#10202b" stroke-width="2"/>
  <text x="245" y="280" text-anchor="middle" font-size="13" font-family="monospace" fill="#1a2530">inspect_tabs.py</text>
  <text x="245" y="300" text-anchor="middle" font-size="11" fill="#8a95a0">list all 59 tabs before loading</text>

  <rect x="445" y="250" width="330" height="70" rx="10" fill="#ffffff" stroke="#10202b" stroke-width="2"/>
  <text x="610" y="280" text-anchor="middle" font-size="13" font-family="monospace" fill="#1a2530">peek_raw_rows.py</text>
  <text x="610" y="300" text-anchor="middle" font-size="11" fill="#8a95a0">find the real header in messy tabs</text>

  <rect x="810" y="250" width="330" height="70" rx="10" fill="#ffffff" stroke="#10202b" stroke-width="2"/>
  <text x="975" y="280" text-anchor="middle" font-size="13" font-family="monospace" fill="#1a2530">explore_key_tabs.py</text>
  <text x="975" y="300" text-anchor="middle" font-size="11" fill="#8a95a0">full column/dtype dump</text>

  <line x1="245" y1="320" x2="500" y2="370" stroke="#6b7b85" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="320" x2="600" y2="370" stroke="#6b7b85" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="975" y1="320" x2="700" y2="370" stroke="#6b7b85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 4: cleaning + join scripts -->
  <rect x="210" y="370" width="380" height="70" rx="10" fill="#eaf4f0" stroke="#7cb88f" stroke-width="2"/>
  <text x="400" y="400" text-anchor="middle" font-size="13" font-family="monospace" fill="#1a2530">load_benchmark_index.py</text>
  <text x="400" y="420" text-anchor="middle" font-size="11" fill="#4a5560">fixes merged header + Excel #N/A errors</text>

  <rect x="630" y="370" width="380" height="70" rx="10" fill="#eaf4f0" stroke="#7cb88f" stroke-width="2"/>
  <text x="820" y="400" text-anchor="middle" font-size="13" font-family="monospace" fill="#1a2530">build_pricing_table.py</text>
  <text x="820" y="420" text-anchor="middle" font-size="11" fill="#4a5560">filters + joins to the benchmark</text>

  <line x1="400" y1="440" x2="610" y2="480" stroke="#6b7b85" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="440" x2="630" y2="480" stroke="#6b7b85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 5: pricing_table.csv -->
  <rect x="410" y="480" width="400" height="60" rx="10" fill="#eaf6f4" stroke="#5fb8b0" stroke-width="2"/>
  <text x="610" y="516" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2530">data/processed/pricing_table.csv</text>

  <line x1="610" y1="540" x2="610" y2="580" stroke="#6b7b85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 6: analyze_pricing.py + notebook (statement box) -->
  <rect x="160" y="580" width="900" height="180" rx="12" fill="#10202b" stroke="#10202b" stroke-width="2"/>
  <text x="610" y="614" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" font-family="monospace">analyze_pricing.py + notebooks/01_ppa_pricing_analysis.ipynb</text>
  <text x="210" y="644" font-size="13" fill="#c9d3d8">&#8226; Naive comparison shown deliberately: +$194/MWh "overpricing" for old-vintage projects</text>
  <text x="210" y="668" font-size="13" fill="#d9704a">&#8226; Diagnosed as a vintage mismatch, not a real pricing signal &mdash; then fixed</text>
  <text x="210" y="692" font-size="13" fill="#c9d3d8">&#8226; Vintage-matched (2022-24) segment comparison, with thin segments explicitly flagged</text>
  <text x="210" y="716" font-size="13" fill="#e8b74a">&#8226; Diagnosis: benchmark is a P25 offer index, not a realized-price comparator</text>
  <text x="210" y="740" font-size="13" fill="#c9d3d8">&#8226; Confirmed directly against LevelTen's own published methodology</text>

  <line x1="400" y1="760" x2="400" y2="800" stroke="#6b7b85" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="760" x2="820" y2="800" stroke="#6b7b85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 7: outputs -->
  <rect x="210" y="800" width="380" height="70" rx="10" fill="#fdf3d8" stroke="#c9971f" stroke-width="2"/>
  <text x="400" y="830" text-anchor="middle" font-size="13" font-family="monospace" fill="#1a2530">ppa_price_trend.png</text>
  <text x="400" y="850" text-anchor="middle" font-size="12" fill="#8a95a0">data/processed/</text>

  <rect x="630" y="800" width="380" height="70" rx="10" fill="#fdf3d8" stroke="#c9971f" stroke-width="2"/>
  <text x="820" y="830" text-anchor="middle" font-size="13" font-family="monospace" fill="#1a2530">recent_vintage_segments.csv</text>
  <text x="820" y="850" text-anchor="middle" font-size="12" fill="#8a95a0">data/processed/</text>
</svg>
